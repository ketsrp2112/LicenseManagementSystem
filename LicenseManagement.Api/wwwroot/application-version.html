<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Version History Detail</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f5f7fb;
            font-family: Segoe UI, Arial, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 20px;
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-title, h3 {
            margin-top: 0;
            color: #1f2937;
        }

        .page-title {
            margin: 0;
        }

        .version-badge {
            background: #f59e0b;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
        }

        .notice {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            color: #856404;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }

            .info-item label {
                display: block;
                color: #64748b;
                font-size: 13px;
                margin-bottom: 5px;
            }

        .info-value {
            font-weight: 600;
            color: #111827;
            word-break: break-word;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1976d2;
            color: white;
            padding: 12px;
        }

        td {
            border: 1px solid #e5e7eb;
            padding: 10px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            cursor: pointer;
        }

            button:hover {
                background: #125bb0;
            }

            button:disabled {
                background: #9ca3af;
                cursor: not-allowed;
            }

        select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .changed {
            background: #fef9c3;
        }
        .Detail-wrapper {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/auth.js"></script>
    <script>checkLogin();</script>
</head>

<body>
    <div id="navbar"></div>
    <div class="container">

        <!-- HEADER -->
        <div class="card header-card">
            <div>
                <h2 class="page-title">Version History Detail</h2>
                <p>TRID : <strong id="trid"></strong></p>
            </div>
            <div>
                <span id="versionBadge" class="version-badge"></span>
            </div>
        </div>




        <!-- APPLICATION -->
        <div class="card">
            <h3>Application Information</h3>
            <div class="info-grid">
                <div class="info-item"><label>Telephone number</label><div id="tel" class="info-value"></div></div>
                <div class="info-item"><label>E-mail</label><div id="email" class="info-value"></div></div>
                <div class="info-item"><label>Remark</label><div id="remark" class="info-value"></div></div>
                <div class="info-item"><label>Created Date</label><div id="createdate" class="info-value"></div></div>
            </div>
        </div>

        <!-- PRODUCTS -->
        <div class="card">
            <h3>Products</h3>
            <div class="Detail-wrapper">
                <table>

                    <thead>

                        <tr>
                            <th>RID</th>
                           
                            <th>Product Name</th>
                            <th>Model Name</th>
                            <th>Description</th>

                        </tr>

                    </thead>

                    <tbody id="productBody">
                    </tbody>

                </table>

            </div>
        </div>

        <!-- FILES -->
        <div class="card">
            <h3>Supporting Documents</h3>
            <table>
                <thead>
                    <tr>
                        <th width="80">No.</th>
                        <th>File Name</th>
                        <th width="150">Action</th>
                    </tr>
                </thead>
                <tbody id="fileBody"></tbody>
            </table>
        </div>

        <!-- NAV -->
        <div class="nav-bar">
            <button type="button" onclick="backToDetail()">← Back </button>

            <div>
                <label for="versionSelect">Go to version : </label>
                <select id="versionSelect" onchange="goVersion(this.value)"></select>
            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/application-version.js"></script>
    <script src="/js/layout.js"></script>
</body>
</html>
